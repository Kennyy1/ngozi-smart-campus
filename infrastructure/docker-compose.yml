services:
  postgres:
    image: postgres:17
    container_name: ngozi-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ngozi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ngozi_postgres_data:
